spec_version: 2




environment:
  environment_name: eac-simple-6
  description: eac env for testing provider-overrides (with fix)
  owner_email: saar.y@quali.com
  state: active
  # spaces:
  #   - Test

 
inputs:
  compute_service_name:
    type: agent
    default: kind-agent
    
  tf_input:
    type: string
    default: "default_input_234566666"
    sensitive: true

outputs:
  tf_output: 
    value: '{{.grains.tf1.outputs.output2}}'
  

grains:
  tf1:
    kind: terraform
    # tf-version: 1.3.5
    spec:
      source:        
        path: terraform/simple-tf-module
        store: test-spec2-public
      agent:
        name: '{{.inputs.compute_service_name}}'        
      inputs:
        - test_input1: '{{.inputs.tf_input}}'
        - test_input2: "input26666"        
      outputs:
        - output2


  tf-providers-ok:
    kind: terraform
    spec:
      source:
        path: terraform/simple-tf-module
        store: test-spec2-public
      agent:
        name: '{{.inputs.compute_service_name}}'
      inputs:
        - test_input2: "bug2"
      provider-overrides:
        - name: aws
          source: hashicorp/aws
          version: "~>5.0"
          attributes:
            assume_role:
              role_arn: "arn:aws:iam::{{ .params.aws_account_id }}:role/quali-torque-deploy"

  tf-providers-retry:
    kind: terraform
    spec:
      source:
        path: terraform/simple-tf-module
        store: test-spec2-public
      agent:
        name: '{{.inputs.compute_service_name}}'
      provider-overrides:
        - name: aws
          source: hashicorp/aws
          version: "~>5.0"
          attributes:
            assume_role:
              role_arn: "arn:aws:iam::{{ .params.aws_account_id }}:role/quali-torque-deploy"

  tf-providers-retry2:
    kind: terraform
    spec:
      source:
        path: terraform/simple-tf-module
        store: test-spec2-public
      agent:
        name: '{{.inputs.compute_service_name}}'
      inputs:
        - test_input2: "bug1"
        - test_input3: "not-a-list"
      provider-overrides:
        - name: aws
          source: hashicorp/aws
          version: "~>5.0"
          attributes:
            assume_role:
              role_arn: "arn:aws:iam::{{ .params.aws_account_id }}:role/quali-torque-deploy"

  tf-providers-retry3:
    kind: terraform
    tf-version: 1.9.0
    spec:
      source:
        path: terraform/simple-tf-module
        store: test-spec2-public
      agent:
        name: '{{.inputs.compute_service_name}}'
      inputs:
        - test_input2: "bug1"
      provider-overrides:
        - name: aws
          source: hashicorp/aws
          version: "~>5.0"
          attributes:
            assume_role:
              role_arn: "arn:aws:iam::{{ .params.aws_account_id }}:role/quali-torque-deploy"
